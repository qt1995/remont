<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Та же комната после чистовой отделки: белые стены, ламинат, откосы, светильник">
  <defs>
    <linearGradient id="f-ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f2"/>
      <stop offset="1" stop-color="#e6e6e3"/>
    </linearGradient>
    <linearGradient id="f-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ebe3"/>
      <stop offset="1" stop-color="#e2dcd2"/>
    </linearGradient>
    <linearGradient id="f-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ddd7cd"/>
      <stop offset="1" stop-color="#efeae2"/>
    </linearGradient>
    <linearGradient id="f-right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e0dad0"/>
      <stop offset="1" stop-color="#f2ede5"/>
    </linearGradient>
    <linearGradient id="f-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a578"/>
      <stop offset="1" stop-color="#ad8a5f"/>
    </linearGradient>
    <linearGradient id="f-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3fa"/>
      <stop offset="1" stop-color="#cfe0ee"/>
    </linearGradient>
    <linearGradient id="f-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- shell -->
  <polygon points="0,0 1600,0 1200,250 400,250" fill="url(#f-ceil)"/>
  <polygon points="0,0 400,250 400,750 0,1000" fill="url(#f-left)"/>
  <polygon points="1600,0 1200,250 1200,750 1600,1000" fill="url(#f-right)"/>
  <rect x="400" y="250" width="800" height="500" fill="url(#f-back)"/>
  <polygon points="0,1000 400,750 1200,750 1600,1000" fill="url(#f-floor)"/>

  <!-- laminate planks converging to VP (800,500) -->
  <g stroke="#946f47" stroke-width="3" opacity="0.55">
    <path d="M400 750 L0 1000"/>
    <path d="M500 750 L250 1000"/>
    <path d="M600 750 L500 1000"/>
    <path d="M700 750 L750 1000"/>
    <path d="M800 750 L1000 1000"/>
    <path d="M900 750 L1250 1000"/>
    <path d="M1000 750 L1500 1000"/>
    <path d="M1100 750 L1720 1000"/>
  </g>
  <g stroke="#8d693f" stroke-width="2" opacity="0.4">
    <path d="M352 780 L1248 780"/>
    <path d="M288 820 L1312 820"/>
    <path d="M208 870 L1392 870"/>
    <path d="M112 930 L1488 930"/>
  </g>
  <polygon points="0,1000 400,750 1200,750 1600,1000" fill="url(#f-light)"/>

  <!-- skirting board -->
  <polygon points="400,750 1200,750 1200,772 400,772" fill="#f7f5f1"/>
  <polygon points="400,750 400,772 0,1000 0,1042" fill="#efece6"/>
  <polygon points="1200,750 1200,772 1600,1000 1600,1042" fill="#efece6"/>

  <!-- window with clean reveals and sill -->
  <rect x="836" y="316" width="308" height="318" fill="#ffffff"/>
  <rect x="850" y="330" width="280" height="290" fill="url(#f-glow)"/>
  <g fill="none" stroke="#ffffff" stroke-width="10">
    <rect x="850" y="330" width="280" height="290"/>
  </g>
  <g fill="none" stroke="#f3f1ed" stroke-width="8">
    <path d="M990 330 L990 620"/>
  </g>
  <!-- distant skyline -->
  <g opacity="0.35" fill="#7f96ab">
    <rect x="864" y="520" width="46" height="96"/>
    <rect x="922" y="480" width="34" height="136"/>
    <rect x="1004" y="540" width="52" height="76"/>
    <rect x="1070" y="500" width="40" height="116"/>
  </g>
  <!-- sill -->
  <polygon points="828,634 1152,634 1160,652 820,652" fill="#ffffff"/>
  <polygon points="820,652 1160,652 1160,660 820,660" fill="#e4e0d8"/>

  <!-- radiator under window -->
  <g fill="#f6f4f0" stroke="#e2ded6" stroke-width="3">
    <rect x="878" y="672" width="224" height="62" rx="6"/>
  </g>
  <g stroke="#e2ded6" stroke-width="3">
    <path d="M902 676 L902 730 M926 676 L926 730 M950 676 L950 730 M974 676 L974 730 M998 676 L998 730 M1022 676 L1022 730 M1046 676 L1046 730 M1070 676 L1070 730"/>
  </g>

  <!-- ceiling light -->
  <ellipse cx="800" cy="150" rx="78" ry="20" fill="#fbfbf9"/>
  <ellipse cx="800" cy="150" rx="60" ry="14" fill="#fff6dd"/>
  <ellipse cx="800" cy="470" rx="240" ry="52" fill="#fff6dd" opacity="0.18"/>

  <!-- door in left wall, closed, white -->
  <polygon points="82,952 82,386 258,412 258,846" fill="#f6f4f0"/>
  <polygon points="106,938 106,404 244,424 244,838" fill="#ffffff"/>
  <polygon points="130,918 130,428 222,444 222,824" fill="#f1efe9"/>
  <circle cx="212" cy="640" r="9" fill="#c2a76a"/>

  <!-- sockets and switch -->
  <g fill="#ffffff" stroke="#e3ded4" stroke-width="3">
    <rect x="612" y="618" width="46" height="46" rx="8"/>
    <rect x="1098" y="678" width="46" height="46" rx="8"/>
  </g>
  <g fill="#dcd6ca">
    <circle cx="635" cy="641" r="12"/>
    <circle cx="1121" cy="701" r="12"/>
  </g>

  <!-- soft daylight pool on floor -->
  <polygon points="700,760 1180,760 1320,940 640,940" fill="#ffffff" opacity="0.16"/>

  <rect width="1600" height="1000" fill="#0b1220" opacity="0.03"/>
</svg>
