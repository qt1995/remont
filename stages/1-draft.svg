<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Комната на черновом этапе: серая штукатурка, бетонный пол, торчащие провода">
  <defs>
    <linearGradient id="d-ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8abaf"/>
      <stop offset="1" stop-color="#c2c4c6"/>
    </linearGradient>
    <linearGradient id="d-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7c2b8"/>
      <stop offset="1" stop-color="#b2ada2"/>
    </linearGradient>
    <linearGradient id="d-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d9a92"/>
      <stop offset="1" stop-color="#bcb8ae"/>
    </linearGradient>
    <linearGradient id="d-right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#a29e96"/>
      <stop offset="1" stop-color="#c9c5bb"/>
    </linearGradient>
    <linearGradient id="d-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6a39c"/>
      <stop offset="1" stop-color="#8e8b85"/>
    </linearGradient>
    <linearGradient id="d-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f0f6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e8f0f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="d-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- shell -->
  <polygon points="0,0 1600,0 1200,250 400,250" fill="url(#d-ceil)"/>
  <polygon points="0,0 400,250 400,750 0,1000" fill="url(#d-left)"/>
  <polygon points="1600,0 1200,250 1200,750 1600,1000" fill="url(#d-right)"/>
  <rect x="400" y="250" width="800" height="500" fill="url(#d-back)"/>
  <polygon points="0,1000 400,750 1200,750 1600,1000" fill="url(#d-floor)"/>

  <!-- ceiling slab seams -->
  <g stroke="#8e9195" stroke-width="3" opacity="0.55">
    <line x1="0" y1="0" x2="400" y2="250"/>
    <line x1="1600" y1="0" x2="1200" y2="250"/>
    <line x1="533" y1="0" x2="620" y2="250"/>
    <line x1="1067" y1="0" x2="980" y2="250"/>
  </g>

  <!-- plaster patches -->
  <g opacity="0.5">
    <path d="M430 300 q90 -30 170 10 q60 40 -10 90 q-120 40 -170 -20 z" fill="#a49f94"/>
    <path d="M620 560 q140 -50 210 20 q30 60 -90 70 q-140 10 -120 -90 z" fill="#bdb8ad"/>
    <path d="M1180 420 q-90 -20 -120 40 q-20 70 90 60 q80 -10 30 -100 z" fill="#a8a398"/>
  </g>
  <rect x="400" y="250" width="800" height="500" fill="#000" opacity="0.05" filter="url(#d-grain)"/>

  <!-- wall chases (штробы) with cable -->
  <g stroke="#7e7a71" stroke-width="14" fill="none" stroke-linecap="square">
    <path d="M470 250 L470 640 L640 640"/>
    <path d="M1120 250 L1120 700"/>
  </g>
  <g stroke="#c0392b" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M470 250 L470 640 L640 640"/>
  </g>
  <g stroke="#2f6fb5" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M1120 250 L1120 700"/>
  </g>

  <!-- socket boxes -->
  <g fill="#3b3b3b">
    <circle cx="640" cy="640" r="26"/>
    <circle cx="1120" cy="700" r="26"/>
    <circle cx="300" cy="620" r="24"/>
  </g>
  <g fill="none" stroke="#d64541" stroke-width="6" stroke-linecap="round">
    <path d="M640 640 l18 -34 M640 640 l30 12"/>
    <path d="M300 620 l-20 -30"/>
  </g>

  <!-- window: raw opening, unfinished reveals -->
  <rect x="836" y="316" width="308" height="318" fill="#8f8b82"/>
  <rect x="850" y="330" width="280" height="290" fill="#dfe8ef"/>
  <rect x="850" y="330" width="280" height="290" fill="url(#d-glow)"/>
  <g fill="#e6ebee" stroke="#b9c2c9" stroke-width="4">
    <rect x="850" y="330" width="280" height="290"/>
    <rect x="864" y="344" width="118" height="262"/>
    <rect x="998" y="344" width="118" height="262"/>
  </g>
  <!-- protective blue film strips -->
  <g fill="#4a86c8" opacity="0.75">
    <rect x="864" y="360" width="118" height="26"/>
    <rect x="998" y="470" width="118" height="26"/>
  </g>
  <g stroke="#8b8377" stroke-width="6" fill="none">
    <path d="M836 316 L820 300 M1144 316 L1160 300"/>
  </g>

  <!-- hanging bulb on wire -->
  <path d="M760 250 L760 400" stroke="#2b2b2b" stroke-width="5" fill="none"/>
  <circle cx="760" cy="424" r="26" fill="#f4e2ad" stroke="#b9a26a" stroke-width="4"/>
  <rect x="748" y="392" width="24" height="18" fill="#8b8b8b"/>

  <!-- floor: raw concrete, screed edge, dust -->
  <g stroke="#7e7b75" stroke-width="3" opacity="0.5" fill="none">
    <path d="M400 750 L0 1000"/>
    <path d="M1200 750 L1600 1000"/>
    <path d="M640 750 L520 1000"/>
    <path d="M960 750 L1080 1000"/>
  </g>
  <path d="M400 760 L1200 760 L1240 790 L360 790 Z" fill="#918e88" opacity="0.7"/>
  <g fill="#b6b3ac" opacity="0.55">
    <ellipse cx="620" cy="880" rx="150" ry="42"/>
    <ellipse cx="1080" cy="820" rx="110" ry="28"/>
  </g>

  <!-- door opening in left wall (no door) -->
  <polygon points="90,944 90,393 250,418 250,844" fill="#4a4741"/>
  <polygon points="118,930 118,414 250,432 250,838" fill="#6d6a63"/>

  <!-- stepladder -->
  <g stroke="#c9a227" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M470 900 L536 690"/>
    <path d="M602 900 L546 690"/>
    <path d="M492 830 L580 830"/>
    <path d="M508 776 L568 776"/>
  </g>
  <rect x="512" y="676" width="70" height="16" rx="4" fill="#b8901f"/>

  <!-- bag of dry mix -->
  <path d="M1000 900 L1160 900 L1150 800 L1010 800 Z" fill="#d8d2c4" stroke="#b6b0a1" stroke-width="4"/>
  <rect x="1030" y="828" width="100" height="30" fill="#c0392b" opacity="0.85"/>

  <!-- bucket -->
  <path d="M760 900 L860 900 L846 812 L774 812 Z" fill="#3f6fa8"/>
  <ellipse cx="810" cy="812" rx="36" ry="10" fill="#5b8ac4"/>

  <!-- level rule leaning on wall -->
  <path d="M1290 950 L1352 470" stroke="#9aa0a6" stroke-width="16" stroke-linecap="round"/>

  <!-- vignette -->
  <rect width="1600" height="1000" fill="#0b1220" opacity="0.06"/>
</svg>
